# xgregorm: OMNeT++ 6 + Veins 5.2 - CAM cez 802.11p na rovnakom scenari SUMO ako xgregorm-hybrid (ns-3).
# Parametre scenara (subory SUMO, RSU, cas, seed) su vo vygenerovanom run_<meno>/scenario.ini (export_scenario.py).
# Parametre radia su nastavene ako v ns-3 (--channel authors --tech 80211p --policy all --security 1
# --wifi-bcast-rate 6 --wifi-rx-min -88), viac v README.md.

[General]
network = xgregorm.XgScenario
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 30s
**.cmdenv-log-level = warn
**.scalar-recording = true
**.vector-recording = false
**.statistic-recording = false
debug-on-errors = false
print-undisposed = false

*.annotations.draw = false
*.obstacles.obstacles = xml("<obstacles/>")  # bez budov (kanal authors v ns-3 ich nema)

# TraCI: SUMO krok 0.1 s ako v ns-3 (VaN3Twin --sumo-updates 0.1)
*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.moduleType = "org.car2x.veins.nodes.Car"

# 802.11p s mojim PHY (navyse mestsky kanal 3GPP XgV2vUrban); model kanala nastavuje vygenerovany omnetpp.ini
*.node[*].nicType = "xgregorm.XgNic80211p"
*.rsu[*].nicType = "xgregorm.XgNic80211p"

# RSU: CAM 1x za s
*.rsu[*].applType = "xgregorm.XgCamApp"
*.rsu[*].appl.isRsu = true
*.rsu[*].appl.headerLength = 0 bit
*.rsu[*].appl.sendBeacons = false
*.rsu[*].appl.dataOnSch = false
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0 m

# auta: CAM podla ETSI
*.node[*].applType = "xgregorm.XgCamApp"
*.node[*].appl.headerLength = 0 bit
*.node[*].appl.sendBeacons = false
*.node[*].appl.dataOnSch = false
*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false
*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.5 m

# 802.11p ako v ns-3: 6 Mbit/s (EN 302 663), sum -97 dBm (-174 + 70 + 7 dB sumove cislo Yans),
# citlivost -88 dBm (--wifi-rx-min -88), len riadiaci kanal (CCH), bez potvrdeni (broadcast)
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2000m
*.connectionManager.drawMaxIntfDist = false
*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.mac1609_4.headerLength = 0 bit
*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -97dBm
*.**.nic.phy80211p.usePropagationDelay = true
*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='isotropic']")
