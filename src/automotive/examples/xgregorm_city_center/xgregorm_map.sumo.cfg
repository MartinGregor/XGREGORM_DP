<configuration>
    <input>
        <net-file value="xgregorm_map.net.xml"/>
        <route-files value="xgregorm_cars.rou.xml"/>
        <additional-files value="stations.xml"/>
    </input>
    <time>
        <begin value="0"/>
        <end value="720"/>
        <step-length value="0.1"/>
    </time>
    <processing>
        <time-to-teleport value="120"/>
        <ignore-route-errors value="true"/>
    </processing>
    <report>
        <no-step-log value="true"/>
    </report>
</configuration>
